name: Fleet CN migration
on:
  push:
    branches: [codex/fleet-cn-multitenant, codex/shared-db-fleet]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      ELIXIR_ASSERT_TIMEOUT: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - uses: actions/cache@v4
        id: beam-cache
        with:
          path: |
            deps
            _build/test
          key: fleet-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      # This branch already has Elixir 1.19 struct typing warnings; preserve logs.
      - run: mix deps.get
      - name: Check changed Elixir formatting
        run: |
          git diff --name-only 49afed642cbf773f5fa8dabf5d45bb61e403ac6a HEAD -- "*.ex" "*.exs" | xargs -r mix format --check-formatted
      - run: mix compile
      - name: Fleet database and OAuth regression
        run: mix test test/tesla_api test/teslamate/fleet
      - run: mix test
      - name: Migrate a real tenant schema using a restricted role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d teslamate_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE tenant_migration_check NOLOGIN; CREATE SCHEMA tenant_migration_check AUTHORIZATION tenant_migration_check; CREATE SCHEMA tenant_migration_check_private AUTHORIZATION tenant_migration_check;'
          TESLAMATE_MULTI_TENANT=false mix run --no-start -e 'TeslaMate.MultiTenant.SharedDatabase.migrate("tenant_migration_check")'
          psql -h localhost -U postgres -d teslamate_test -v ON_ERROR_STOP=1 -c 'SET ROLE tenant_migration_check; SELECT count(*) FROM tenant_migration_check.cars; SELECT count(*) FROM tenant_migration_check_private.tokens;'
      - name: Verify historical copy without rewriting values or IDs
        env:
          PGPASSWORD: postgres
          SOURCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/migration_source?sslmode=disable
          SHARED_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teslamate_test?sslmode=disable
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          createdb -h localhost -U postgres migration_source
          psql -h localhost -U postgres -d migration_source -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA private;
          CREATE TABLE cars (id serial PRIMARY KEY, name text, odometer numeric(16,6), measured double precision, recorded_at timestamptz);
          INSERT INTO cars VALUES (1, 'public.private.tokens', 123456.789123, 3.141592653589793, '2026-09-23 12:34:56.123456+08');
          SELECT setval('cars_id_seq', 42);
          CREATE TABLE private.tokens (id integer PRIMARY KEY, ciphertext bytea);
          INSERT INTO private.tokens VALUES (1, decode('001122ff', 'hex'));
          SQL
          python3 tools/shared/migrate.py --tenant-id copy-check --runtime-role postgres --source-stopped --work-dir /tmp/shared-copy-check
          python3 -c 'import json; assert json.load(open("/tmp/shared-copy-check/verification.json"))["verified"]'
      - name: Copy a complete TeslaMate schema including extensions and functions
        env:
          SOURCE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/migration_full_source?sslmode=disable
          SHARED_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/teslamate_test?sslmode=disable
        run: |
          export PATH=/usr/lib/postgresql/16/bin:$PATH
          DATABASE_NAME=migration_full_source mix ecto.create
          DATABASE_NAME=migration_full_source mix ecto.migrate
          python3 tools/shared/migrate.py --tenant-id full-copy-check --runtime-role postgres --source-stopped --work-dir /tmp/shared-full-copy-check
          python3 -c 'import json; assert json.load(open("/tmp/shared-full-copy-check/verification.json"))["verified"]'
      - run: python3 -m unittest discover -s tools/fleet/tests -v
        if: always()
      - uses: actions/cache/save@v4
        if: always() && steps.beam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps
            _build/test
          key: fleet-${{ runner.os }}-${{ hashFiles('mix.lock') }}

  receiver-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_NAME: teslamate_fleet_e2e
      FLEET_SMOKE_DIR: /tmp/fleet-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/test
          key: fleet-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get && mix compile && mix ecto.create && mix ecto.migrate
      - run: pip install -r tools/fleet/requirements.txt
      - name: Prepare isolated test certificates and official vehicle wire client
        run: |
          python3 tools/fleet/integration/prepare.py "$FLEET_SMOKE_DIR"
          git clone https://github.com/teslamotors/fleet-telemetry.git /tmp/fleet-source
          git -C /tmp/fleet-source checkout 8fbaa100bd365936dab6ecbf0e2d7070c4d765cb
          mkdir -p /tmp/fleet-source/tools/teslamate-smoke
          cp tools/fleet/integration/client.go /tmp/fleet-source/tools/teslamate-smoke/main.go
          cd /tmp/fleet-source
          go build -o "$FLEET_SMOKE_DIR/vehicle-client" ./tools/teslamate-smoke
      - name: Build and start official receiver, Kafka and signing proxy
        run: |
          docker network create fleet-smoke-network
          docker compose --env-file "$FLEET_SMOKE_DIR/.env" -f deploy/fleet/compose.yml -f "$FLEET_SMOKE_DIR/override.json" config --quiet
          docker compose --env-file "$FLEET_SMOKE_DIR/.env" -f deploy/fleet/compose.yml -f "$FLEET_SMOKE_DIR/override.json" up -d --build kafka-init fleet-telemetry fleet-command
      - name: Validate optional isolated account deployment
        run: |
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0,"tools/fleet"); from setup import account_test; account_test(Path("/tmp/fleet-smoke"))'
          cp /tmp/fleet-smoke/runtime/account-test.env /tmp/fleet-account-test.env
          mkdir -p deploy/fleet/runtime
          cp /tmp/fleet-account-test.env deploy/fleet/runtime/account-test.env
          docker compose --env-file "$FLEET_SMOKE_DIR/.env" -f deploy/fleet/compose.yml -f deploy/fleet/compose.account-test.yml config --quiet
      - name: Real receiver to tenant database integration
        run: python3 tools/fleet/integration/run.py
      - name: Integration diagnostics
        if: failure()
        run: |
          cat /tmp/fleet-smoke/*.log || true
          docker compose --env-file "$FLEET_SMOKE_DIR/.env" -f deploy/fleet/compose.yml -f "$FLEET_SMOKE_DIR/override.json" logs --tail 100 || true
      - name: Stop isolated stack
        if: always()
        run: docker compose --env-file "$FLEET_SMOKE_DIR/.env" -f deploy/fleet/compose.yml -f "$FLEET_SMOKE_DIR/override.json" down -v || true

  shared-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shared_release_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual release image
        run: docker build -t teslamate-shared-ci .
      - name: Initialize public baseline and migrate a restricted tenant
        env:
          PGPASSWORD: postgres
        run: |
          cat > "$RUNNER_TEMP/release.env" <<'ENV'
          DATABASE_HOST=127.0.0.1
          DATABASE_PORT=5432
          DATABASE_USER=postgres
          DATABASE_PASS=postgres
          DATABASE_NAME=shared_release_ci
          ENCRYPTION_KEY=isolated-release-test-encryption-key
          DISABLE_MQTT=true
          ENV
          docker run --rm --network host --env-file "$RUNNER_TEMP/release.env" --entrypoint /bin/dash teslamate-shared-ci -lc 'bin/teslamate eval "TeslaMate.Release.migrate"'
          psql -h localhost -U postgres -d shared_release_ci -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE shared_runtime LOGIN NOINHERIT PASSWORD 'isolated-runtime-password';
          CREATE ROLE tenant_release NOLOGIN;
          GRANT tenant_release TO shared_runtime;
          CREATE SCHEMA tenant_release AUTHORIZATION tenant_release;
          CREATE SCHEMA tenant_release_private AUTHORIZATION tenant_release;
          SQL
          docker run --rm --network host --env-file "$RUNNER_TEMP/release.env" -e DATABASE_USER=shared_runtime -e DATABASE_PASS=isolated-runtime-password -e TESLAMATE_MULTI_TENANT=false --entrypoint /bin/dash teslamate-shared-ci -lc 'bin/teslamate eval "TeslaMate.MultiTenant.SharedDatabase.migrate(\"tenant_release\")"'
      - name: Start the shared release and query its tenant database
        run: |
          cat > "$RUNNER_TEMP/tenants.json" <<'JSON'
          {"tenants":[{"id":"release","status":"active","database":{"host":"127.0.0.1","port":5432,"username":"shared_runtime","password":"isolated-runtime-password","name":"shared_release_ci","schema":"tenant_release"},"mqtt":{"disabled":true},"vehicles":[]}]}
          JSON
          chmod 644 "$RUNNER_TEMP/tenants.json"
          docker run -d --name shared-release --network host --env-file "$RUNNER_TEMP/release.env" \
            -e DATABASE_USER=shared_runtime -e DATABASE_PASS=isolated-runtime-password \
            -e TESLAMATE_MULTI_TENANT=true -e TESLAMATE_SHARED_DATABASE=true \
            -e TESLAMATE_TENANT_DIRECTORY=/etc/tenants.json -e TESLAMATE_TENANT_START_WEB=true \
            -e TESLAMATE_TENANT_START_MQTT=false -e TESLAMATE_INTERNAL_API_TOKEN=isolated-ci-token \
            -v "$RUNNER_TEMP/tenants.json:/etc/tenants.json:ro" teslamate-shared-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent -H 'Authorization: Bearer isolated-ci-token' http://localhost:4000/api/internal/tenants/release/fleet/status > /tmp/release-status.json; then
              python3 -c 'import json; assert json.load(open("/tmp/release-status.json"))["data"] == []'
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Release diagnostics
        if: failure()
        run: docker logs shared-release || true
      - name: Stop release
        if: always()
        run: docker rm -f shared-release || true
