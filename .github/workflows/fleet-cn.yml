name: Fleet CN migration
on:
  push:
    branches: [codex/fleet-cn-multitenant]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      ELIXIR_ASSERT_TIMEOUT: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19.5'
      - uses: actions/cache@v4
        id: beam-cache
        with:
          path: |
            deps
            _build/test
          key: fleet-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      # This branch already has Elixir 1.19 struct typing warnings; preserve logs.
      - run: mix deps.get
      - name: Format changed Elixir files
        run: |
          git diff --name-only 49afed642cbf773f5fa8dabf5d45bb61e403ac6a HEAD -- "*.ex" "*.exs" | xargs -r mix format
          git diff -- "*.ex" "*.exs" | gzip | base64 -w0
      - run: mix compile
      - name: Fleet database and OAuth regression
        run: mix test test/tesla_api test/teslamate/fleet
      - run: mix test
      - run: python3 -m unittest discover -s tools/fleet/tests -v
        if: always()
      - uses: actions/cache/save@v4
        if: always() && steps.beam-cache.outputs.cache-hit != 'true'
        with:
          path: |
            deps
            _build/test
          key: fleet-${{ runner.os }}-${{ hashFiles('mix.lock') }}
